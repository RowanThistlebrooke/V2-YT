<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nova Lite · AI Mentor</title>
<link rel="stylesheet" href="design-system.css">
<script src="topbar.js" defer></script>
<!-- ============================================================
 * NOVA LITE — a simple, drop-in AI mentor for ANY dashboard.
 * Single self-contained file. No backend, no build step.
 *
 * HOW IT WORKS (bring-your-own-key):
 *   • The viewer pastes their OWN Anthropic API key (stored only in
 *     their browser's localStorage — never sent anywhere but Anthropic).
 *   • Nova reads whatever the dashboard saved in localStorage for context.
 *   • Calls the Claude API directly from the browser using the
 *     `anthropic-dangerous-direct-browser-access` header.
 *
 * This is the lightweight version: a flat CSS orb (no 3D), basic chat.
 * The premium build (3D avatar, Spark voice scheduler, secure server
 * proxy, palettes) is the paid Patreon episode.
 * ============================================================ -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --accent: #6EE7B7; --accent-2: #67E8F9; --bg: #05060c; --fg: #e9ecf5; --muted: rgba(233,236,245,.55); --line: rgba(34,211,245,.1); }
html, body { background: var(--bg); }
body { padding: 0; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--fg); min-height: 100vh; }

.wrap { max-width: 560px; margin: 0 auto; padding: 28px 18px 60px; }
.top { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
.key-toggle { border: 1px solid var(--line); background: rgba(34,211,245,.03); border-radius: 10px; padding: 7px 10px; cursor: pointer; font-size: 15px; line-height: 1; opacity: .55; transition: opacity .15s; }
.key-toggle:hover { opacity: 1; }
.key-toggle.has-key { opacity: 1; border-color: var(--accent); }
.new-chat-btn { margin-left: auto; border: 1px solid var(--line); background: rgba(34,211,245,.03); border-radius: 10px; padding: 7px 10px; cursor: pointer; font-size: 14px; line-height: 1; opacity: .55; transition: opacity .15s; }
.new-chat-btn:hover { opacity: 1; }
.keypanel { display: none; }
.keypanel.open { display: block; }

/* ---- flat CSS orb avatar (lightweight, no Three.js) ---- */
.orb { width: 60px; height: 60px; border-radius: 50%; position: relative; flex-shrink: 0;
  background: radial-gradient(circle at 32% 28%, #eafff6, var(--accent) 42%, #1f8f66 100%);
  box-shadow: 0 0 22px -2px var(--accent), inset 0 -6px 14px rgba(0,0,0,.25);
  animation: orbFloat 4s ease-in-out infinite; }
.orb::before, .orb::after { content: ''; position: absolute; top: 38%; width: 9px; height: 9px; border-radius: 50%;
  background: #06281d; box-shadow: 0 0 6px rgba(0,0,0,.4); transition: height .15s; }
.orb::before { left: 30%; } .orb::after { right: 30%; }
.orb.think { animation: orbFloat 1.1s ease-in-out infinite, orbPulse 1.1s ease-in-out infinite; }
.orb.happy::before, .orb.happy::after { height: 4px; border-radius: 0 0 9px 9px; }
@keyframes orbFloat { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
@keyframes orbPulse { 0%,100% { box-shadow: 0 0 22px -2px var(--accent) } 50% { box-shadow: 0 0 34px 2px var(--accent) } }

.title h1 { font-family: 'Times New Roman', Georgia, serif; font-style: italic; font-size: 26px; font-weight: 500;
  background: linear-gradient(90deg, var(--accent-2), var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.title .role { font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }

/* ---- key setup ---- */
.keybar { display: flex; gap: 8px; margin-bottom: 16px; }
.keybar input { flex: 1; background: rgba(34,211,245,.03); border: 1px solid var(--line); color: var(--fg); border-radius: 10px; padding: 11px 13px; font-size: 13px; outline: none; }
.keybar input:focus { border-color: var(--accent); }
.keybar button { border: 0; border-radius: 10px; padding: 0 16px; cursor: pointer; color: #04140d; background: var(--accent); font-weight: 600; font-size: 13px; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 18px; }
.hint a { color: var(--accent-2); }
.hint.saved { color: var(--accent); }

/* ---- chat ---- */
.feed { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.msg { max-width: 90%; }
.msg.user { align-self: flex-end; }
.msg.coach { align-self: flex-start; width: 100%; }
.bubble { border-radius: 14px; padding: 13px 15px; font-size: 14.5px; line-height: 1.55; }
.msg.user .bubble { background: rgba(34,211,245,.05); border: 1px solid var(--line); }
.msg.coach .bubble { background: rgba(34,211,245,.04); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-left: 3px solid var(--accent); }
.tag { display: inline-block; margin-bottom: 9px; font-family: ui-monospace, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #04140d; background: var(--accent); padding: 3px 9px; border-radius: 999px; }
.bubble b, .pill { color: var(--accent); font-weight: 700; }
.pill { background: color-mix(in srgb, var(--accent) 18%, transparent); padding: 1px 7px; border-radius: 6px; font-weight: 600; }
.reply-list { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 6px; }
.reply-list li { line-height: 1.45; }
.dots { display: inline-flex; gap: 5px; } .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .4; animation: d 1.2s ease-in-out infinite; }
.dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
@keyframes d { 0%,100%{opacity:.35;transform:scale(1)} 50%{opacity:1;transform:scale(1.4)} }

.composer { display: flex; gap: 9px; }
.composer input { flex: 1; background: rgba(34,211,245,.03); border: 1px solid var(--line); color: var(--fg); border-radius: 12px; padding: 13px 15px; font-size: 14.5px; outline: none; }
.composer input:focus { border-color: var(--accent); }
.composer button { width: 50px; border: 0; border-radius: 12px; cursor: pointer; color: #04140d; background: var(--accent); font-size: 18px; }
.composer button:active { transform: scale(.94); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="orb" id="orb"></div>
      <div class="title"><h1>Nova Lite</h1><div class="role">your mentor</div></div>
      <button id="newChatBtn" class="new-chat-btn" aria-label="New conversation" title="New conversation">↻</button>
      <button id="profileToggle" class="key-toggle" aria-label="About you" title="About you">👤</button>
      <button id="keyToggle" class="key-toggle" aria-label="API key settings" title="API key">🔑</button>
    </div>

    <div class="keypanel" id="keypanel">
      <div class="keybar">
        <input id="keyInput" type="password" placeholder="paste your Anthropic API key (sk-ant-…)" autocomplete="off" />
        <button id="keySave">Save</button>
      </div>
      <div class="hint" id="hint">
        Your key is stored only in <b>this browser</b> and sent straight to Anthropic — never to us.
        Get one at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.
      </div>
    </div>

    <div class="keypanel" id="profilepanel">
      <textarea id="profileInput" rows="7" placeholder="Tell Nova about yourself — goals, priorities, what's actually going on in your life. This gets sent with every message alongside your dashboard data." style="width:100%;background:rgba(34,211,245,.03);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:11px 13px;font-size:13px;font-family:inherit;outline:none;resize:vertical"></textarea>
      <div style="display:flex;justify-content:flex-end;margin-top:8px">
        <button id="profileSave" style="border:0;border-radius:10px;padding:9px 16px;cursor:pointer;color:#04140d;background:var(--accent);font-weight:600;font-size:13px">Save</button>
      </div>
      <div class="hint" id="profileHint">
        Stored only in <b>this browser</b>, sent as context with every message — never to us.
        Edit this any time; the more specific, the better advice you'll get.
      </div>
    </div>

    <div class="feed" id="feed"></div>

    <div class="composer">
      <input id="chatInput" placeholder="ask Nova anything…" autocomplete="off" />
      <button id="send" aria-label="Send">→</button>
    </div>
  </div>

<script>
(function(){
  const KEY_LS = 'nova_lite_api_key';
  const HIST_KEY = 'nova:lite:history';
  const PROFILE_LS = 'nova:profile';
  const feed = document.getElementById('feed');
  const input = document.getElementById('chatInput');
  const orb = document.getElementById('orb');
  const keyInput = document.getElementById('keyInput');
  const hint = document.getElementById('hint');
  const keypanel = document.getElementById('keypanel');
  const keyToggle = document.getElementById('keyToggle');
  const newChatBtn = document.getElementById('newChatBtn');
  keyToggle.addEventListener('click', () => keypanel.classList.toggle('open'));

  // ---- "About you" profile — free-text context sent with every message,
  // alongside the raw dashboard data, so Nova knows more than just numbers. ----
  const profilepanel = document.getElementById('profilepanel');
  const profileToggle = document.getElementById('profileToggle');
  const profileInput = document.getElementById('profileInput');
  const profileSave = document.getElementById('profileSave');
  const DEFAULT_PROFILE =
    "Starter draft — edit this to be accurate, then Save. Add or remove anything.\n\n" +
    "- Uses this dashboard as a personal command center: to-dos, fitness, health, finances, side hustles, reading.\n" +
    "- Mostly on phone, not a laptop.\n" +
    "- Also has a Telegram assistant wired into the same dashboard data, for on-the-go questions and quick logging.\n" +
    "- Training: push/legs/lower split, tracks a daily supplement stack (creatine included).\n" +
    "- Finance: tracks net worth across cash, bank, stocks, and crypto (incl. live wallet tracking), logs purchases separately from incoming orders.\n" +
    "- Runs a side hustle / affiliate + editing-client business alongside a reading habit.\n" +
    "- Wants nudges (text reminders) for whatever recurring habit hasn't been done yet each day.\n" +
    "- Prefers being walked through things step by step over reading long docs.\n" +
    "- What Nova should actually know: your bigger goals, what's stressing you out, what you're working toward — add that here.";
  function loadProfile() { try { return localStorage.getItem(PROFILE_LS) || ''; } catch (e) { return ''; } }
  function saveProfile(v) { try { localStorage.setItem(PROFILE_LS, v); } catch (e) {} }
  profileInput.value = loadProfile() || DEFAULT_PROFILE;
  profileToggle.addEventListener('click', () => profilepanel.classList.toggle('open'));
  profileSave.addEventListener('click', () => {
    saveProfile(profileInput.value);
    profileHint.textContent = '✓ Saved — Nova will use this from your next message.';
    setTimeout(() => { profileHint.innerHTML = 'Stored only in <b>this browser</b>, sent as context with every message — never to us. Edit this any time; the more specific, the better advice you\'ll get.'; }, 2500);
  });

  // Running conversation history, persisted locally so Nova remembers past
  // chats across reloads instead of forgetting everything on refresh.
  // Capped to the last 20 turns so it can't grow unbounded.
  function loadHistory() { try { const h = JSON.parse(localStorage.getItem(HIST_KEY)); return Array.isArray(h) ? h : []; } catch (e) { return []; } }
  function saveHistory() { try { localStorage.setItem(HIST_KEY, JSON.stringify(history)); } catch (e) {} }
  let history = loadHistory();

  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function setOrb(s){ orb.className = 'orb' + (s ? ' ' + s : ''); }

  // ---- key handling ----
  function savedKey(){ try { return localStorage.getItem(KEY_LS) || ''; } catch(e){ return ''; } }
  if (savedKey()) { hint.classList.add('saved'); hint.innerHTML = '✓ Key saved in this browser. Ask away.'; keyInput.placeholder = '•••• key saved ••••'; keyToggle.classList.add('has-key'); }
  document.getElementById('keySave').addEventListener('click', () => {
    const k = keyInput.value.trim();
    if (!k) return;
    try { localStorage.setItem(KEY_LS, k); } catch(e){}
    keyInput.value = ''; keyInput.placeholder = '•••• key saved ••••';
    hint.classList.add('saved'); hint.innerHTML = '✓ Key saved in this browser. Ask away.';
    keyToggle.classList.add('has-key');
    keypanel.classList.remove('open'); // tuck it away so it's not on screen
  });

  // ---- read whatever the dashboard stored (for context) ----
  function dashboardData(){
    const out = {};
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k === KEY_LS) continue; // never send the key as data
      try { out[k] = JSON.parse(localStorage.getItem(k)); } catch(e){ out[k] = localStorage.getItem(k); }
    }
    return out;
  }

  // ---- render: bullets + **pills** ----
  function inlineMarks(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<span class="pill">$1</span>'); }
  function render(text){
    const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const items = [], loose = [];
    for (const l of lines){
      if (/^[-•*]\s+/.test(l)) items.push('<li>' + inlineMarks(l.replace(/^[-•*]\s+/, '')) + '</li>');
      else loose.push(inlineMarks(l));
    }
    let html = loose.join('<br>');
    if (items.length) html += (html ? '<br>' : '') + '<ul class="reply-list">' + items.join('') + '</ul>';
    return html;
  }
  function addUser(t){ const e = document.createElement('div'); e.className = 'msg user'; e.innerHTML = '<div class="bubble">' + esc(t) + '</div>'; feed.appendChild(e); scroll(); }
  function addCoach(html){ const e = document.createElement('div'); e.className = 'msg coach'; e.innerHTML = '<div class="bubble"><span class="tag">Nova</span><div>' + html + '</div></div>'; feed.appendChild(e); scroll(); return e; }
  function scroll(){ window.scrollTo(0, document.body.scrollHeight); }

  const SYS =
    "You are Nova, a personal mentor living inside the user's life-tracking dashboard. " +
    "You can see their saved data (food, water, gym, finance, sleep, goals, etc.). " +
    "If a 'google:snapshot' key is present, it has today's Calendar events, Gmail unread " +
    "count/subjects, and recent Drive files — use it when relevant (e.g. factor a packed " +
    "schedule into training/recovery advice, or note an unread inbox piling up). " +
    "Give honest, specific, encouraging guidance. " +
    "Answer in short bullet points starting with '- ', few words each, plain language. " +
    "Wrap key words and numbers in **double asterisks**. " +
    "End with one '- Do today:' bullet giving the single action.";

  let busy = false;
  async function ask(text){
    text = (text||'').trim(); if (!text || busy) return;
    const key = savedKey();
    if (!key){ addCoach('- Paste your **Anthropic API key** above first, then ask me again.'); return; }
    busy = true; addUser(text); input.value = '';
    history.push({ role: 'user', content: text });
    if (history.length > 20) history = history.slice(-20);
    saveHistory();
    setOrb('think');
    const loading = addCoach('<span class="dots"><i></i><i></i><i></i></span>');
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-opus-4-8',
          max_tokens: 1024,
          system: SYS + "\n\nAbout the user (their own words — weigh this heavily):\n" + (loadProfile() || DEFAULT_PROFILE) + "\n\nDashboard data as JSON:\n" + JSON.stringify(dashboardData()),
          messages: history,
        }),
      });
      const json = await res.json();
      if (json.error){ loading.querySelector('div:last-child').innerHTML = render('- ' + (json.error.message || 'Something went wrong — check your API key.')); setOrb(''); busy = false; history.pop(); saveHistory(); return; }
      const reply = (json.content && json.content[0] && json.content[0].text) || 'Hmm, no reply.';
      history.push({ role: 'assistant', content: reply });
      saveHistory();
      loading.querySelector('div:last-child').innerHTML = render(reply);
      setOrb('happy'); setTimeout(() => setOrb(''), 2500);
    } catch(e){
      loading.querySelector('div:last-child').innerHTML = render('- Could not reach Anthropic — check your connection and key.');
      setOrb('');
      history.pop(); saveHistory();
    }
    busy = false;
  }

  document.getElementById('send').addEventListener('click', () => ask(input.value));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(input.value); });
  newChatBtn.addEventListener('click', () => {
    history = []; saveHistory(); feed.innerHTML = '';
    addCoach('Hey — I am <b>Nova</b>. Paste your key above, then ask me about food, training, sleep, or where to start. I keep it short and give you <b>one thing to act on</b>.');
  });

  if (history.length) {
    history.forEach(m => m.role === 'user' ? addUser(m.content) : addCoach(render(m.content)));
  } else {
    addCoach('Hey — I am <b>Nova</b>. Paste your key above, then ask me about food, training, sleep, or where to start. I keep it short and give you <b>one thing to act on</b>.');
  }
})();
</script>
</body>
</html>
